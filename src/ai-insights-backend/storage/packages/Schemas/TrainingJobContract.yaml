# =============================================================================
# TRAINING JOB CONTRACT — AutoML Platform
# Scope: AGENT TRAINING ONLY.
#
# Dataset ingestion, data understanding, profiling, feature engineering,
# feature selection, and preprocessing are handled by upstream agents.
# This contract consumes their finalized outputs through upstream_artifacts.
#
# The training agent uses this contract to:
# 1. Understand the ML problem.
# 2. Select/validate the training strategy.
# 3. Train candidate models.
# 4. Optimize hyperparameters.
# 5. Evaluate and select the best model.
#
# Every field should contain either a concrete value or an explicit null when
# it is not applicable.
# =============================================================================


# -----------------------------------------------------------------------------
# PRIMARY METRIC
# -----------------------------------------------------------------------------

x-primary-metric-name: &primary_metric_name
  "<Write the metric that most appropriately measures success for the prediction objective and business goal.>"

x-primary-metric-def: &primary_metric_def
  value: *primary_metric_name
  source:
    "<State whether the metric was derived from the use case, explicitly provided by the user, or selected as a general platform choice.>"
  confidence:
    "<State how confident you are that the selected metric correctly represents the business objective.>"
  confirmation_threshold:
    "<State the confidence level above which explicit confirmation of the metric is not required.>"
  requires_confirmation:
    "<State whether the selected metric requires confirmation before training proceeds.>"

  rationale:
    "<Explain why this metric best represents the business objective and prediction goal.>"

  evidence:
    - "<Describe the business requirement, prediction objective, target behavior, or other evidence that supports selecting this metric.>"


# -----------------------------------------------------------------------------
# TRAINING JOB
# -----------------------------------------------------------------------------

training_job:
  job_id:
    "<Write the identifier assigned to this training job.>"

  experiment_name:
    "<Write a meaningful name that identifies the training experiment and its purpose.>"

  version:
    "<Write the version of this training configuration.>"

  created_at:
    "<Write the timestamp when this training configuration was created.>"

  created_by:
    "<Write the agent, user, or system responsible for creating this training configuration.>"

  description:
    "<Summarize the purpose of this training job and what the resulting model is expected to accomplish.>"


# -----------------------------------------------------------------------------
# ML TASK
# -----------------------------------------------------------------------------

task:

  task_type:
    "<Identify the machine learning problem represented by the use case, target, and prediction objective.>"

  task_subtype:
    "<Describe the specific form of the identified machine learning problem.>"

  learning_type:
    "<Identify how the model should learn based on the availability and nature of the target and training information.>"

  prediction_type:
    "<Describe what the trained model should return to satisfy the prediction requirement.>"

  prediction_horizon:
    "<Describe the future period or point for which the prediction is intended, when the use case involves a future outcome.>"

  prediction_timestamp:
    "<Identify the point in time at which the information available for making the prediction should be considered valid.>"


# -----------------------------------------------------------------------------
# UPSTREAM ARTIFACTS
# -----------------------------------------------------------------------------

upstream_artifacts:

  dataset_path:
    "<Write the identifier of the finalized dataset that will be used for training. Get it from the directory>"

  dataset_version:
    "<Write the version of the finalized dataset used for this training job. Get it from the directory>"

  feature_set_path:
    "<Write the identifier of the finalized feature set used for training. Get it from the directory>"

  feature_set_version:
    "<Write the version of the finalized feature set used for this training job. Get it from the directory>"

  profiling_report_path:
    "<Write the identifier of the profiling information used when making training decisions. Get it from the directory>"

  relationship_schema_path:
    "<Write the identifier of the finalized relationship information used to understand relationships between the training data entities, when applicable. Get it from the directory>"

  row_count:
    "<Write the number of records available in the finalized training dataset.>"

  column_count:
    "<Write the number of columns available in the finalized training dataset.>"


# -----------------------------------------------------------------------------
# DATA SPLITTING
# -----------------------------------------------------------------------------

split:

  strategy:
    "<Select the data splitting approach that most closely represents how the model will encounter data in its intended usage.>"

  train_ratio:
    "<Specify the proportion of available data that should be used for model training.>"

  validation_ratio:
    "<Specify the proportion of available data that should be used for model validation and model or parameter selection.>"

  test_ratio:
    "<Specify the proportion of available data that should be reserved for final unbiased model evaluation.>"

  random_seed: 42

  stratify_by:
    "<Identify the target or other variable whose distribution should be preserved across the data splits, when needed.>"

  group_by:
    "<Identify the entity or grouping attribute whose related records must remain within the same data split, when needed.>"

  time_column:
    "<Identify the time attribute that should determine the ordering of records for a time-dependent split, when needed.>"

  cross_validation:

    enabled:
      "<Determine whether repeated validation across multiple subsets of the training data is appropriate for this use case.>"

    strategy:
      "<Select the cross-validation approach that best matches the characteristics of the dataset and prediction problem.>"

    folds:
      "<Specify the number of validation folds to use when cross-validation is enabled.>"

    shuffle:
      "<Determine whether records should be reordered before creating cross-validation folds.>"

    random_seed: 42


# -----------------------------------------------------------------------------
# CLASS IMBALANCE
# -----------------------------------------------------------------------------

imbalance:

  detected:
    "<Determine whether the target distribution contains a meaningful imbalance that could affect model training.>"

  ratio:
    "<Write the observed proportion of the minority or positive outcome relative to the majority or negative outcome.>"

  strategy:
    "<Determine how the observed class imbalance should be addressed during model training.>"

  class_weights:
    "<Determine whether different classes should receive different importance during model training and describe the chosen weighting approach.>"

  sampling:

    method:
      "<Determine whether the training records should be resampled to address the observed class distribution and describe the selected approach.>"

    sampling_ratio:
      "<Specify the desired class distribution after sampling when resampling is used.>"


# -----------------------------------------------------------------------------
# SEARCH SPACE
# -----------------------------------------------------------------------------

search_space:

  "<Write the name of a model parameter whose value should be optimized.>":

    type:
      "<Describe the way the parameter values should be explored.>"

    min:
      "<Specify the lower boundary of the parameter values to explore, when applicable.>"

    max:
      "<Specify the upper boundary of the parameter values to explore, when applicable.>"

    values:
      "<List the parameter values that should be considered when the parameter has a defined set of alternatives.>"


# -----------------------------------------------------------------------------
# TRAINING OBJECTIVE
# -----------------------------------------------------------------------------

objective:

  training_loss:
    "<Identify the loss function that should be optimized during model training for the selected prediction problem.>"

  optimization_metric:
    *primary_metric_name

  direction:
    "<Determine whether improvement in the optimization objective corresponds to increasing or decreasing its value.>"

  custom_objective:

    enabled:
      "<Determine whether the standard training objective is insufficient and a custom training objective is needed.>"

    definition:
      "<Describe the custom objective that should be optimized and how it relates to the prediction goal, when applicable.>"


# -----------------------------------------------------------------------------
# EVALUATION
# -----------------------------------------------------------------------------

evaluation:

  primary_metric:
    *primary_metric_def

  secondary_metrics:
    - "<Identify an additional performance metric that provides useful information beyond the primary metric.>"

  # Optional metrics translating model performance into business impact.
  # business_metrics:
  #   - name: "<string>"
  #     description: "<string>"

  thresholds:

    primary_metric_min:
      "<Specify the minimum primary metric performance required for a model to be considered acceptable.>"

    secondary_metric_constraints:
      "<Define any minimum or maximum performance requirements for secondary metrics that are important to the use case.>"

  segment_analysis:
    - "<Identify a business or data segment for which model performance should be evaluated separately.>"

  confidence_intervals:

    enabled:
      "<Determine whether uncertainty around the reported model performance should be estimated.>"

  bootstrap:

    enabled:
      "<Determine whether repeated resampling should be used to estimate uncertainty in the evaluation results.>"

    samples:
      "<Specify the number of resampling iterations to use when estimating evaluation uncertainty.>"

  fairness_scope:

    protected_attributes:
      - "<Identify an attribute across which model performance or outcomes should be examined for potential disparity, when applicable.>"

    metric:
      "<Identify the fairness measure that should be used to compare outcomes across the relevant groups.>"

    max_disparity:
      "<Specify the largest acceptable difference in the selected fairness measure between the relevant groups.>"


# -----------------------------------------------------------------------------
# THRESHOLD OPTIMIZATION
# -----------------------------------------------------------------------------

thresholding:

  enabled:
    "<Determine whether model outputs need a decision threshold to convert predicted scores or probabilities into business decisions.>"

  default_threshold:
    "<Specify the default decision threshold to use when converting model scores or probabilities into decisions.>"

  optimization:

    enabled:
      "<Determine whether the decision threshold should be optimized using the evaluation objective or business requirements.>"

    metric:
      "<Identify the performance measure that should guide selection of the decision threshold.>"

    constraints:
      "<Define the business or performance conditions that the selected threshold must satisfy.>"


# -----------------------------------------------------------------------------
# VALIDATION GATES
# -----------------------------------------------------------------------------

validation_gates:

  minimum_primary_metric:
    "<Specify the minimum primary metric performance that a trained model must achieve to be accepted.>"

  maximum_overfitting_gap:
    "<Specify the largest acceptable difference between training and validation performance.>"

  maximum_latency:
    "<Specify the maximum prediction latency acceptable for the intended model usage.>"

  maximum_model_size:
    "<Specify the largest acceptable size of the trained model for its intended deployment environment.>"

  fairness_requirements:
    "<Describe the fairness conditions that the trained model must satisfy before acceptance, when applicable.>"

  data_quality_requirements:

    max_null_rate:
      "<Specify the maximum acceptable proportion of missing values in data presented to the trained model.>"

    schema_match:
      "<Describe how closely incoming prediction data must correspond to the data structure expected by the trained model.>"

  calibration_requirement:

    method:
      "<Identify the probability calibration approach that should be applied when calibrated predictions are required.>"

    max_calibration_error:
      "<Specify the maximum acceptable difference between predicted probabilities and observed outcomes.>"

  stability_requirement:

    metric_variance_across_folds_max:
      "<Specify the maximum acceptable variation in model performance across validation folds.>"

  pass_condition:
    "<Describe how the validation results should determine whether the trained model is accepted.>"


# -----------------------------------------------------------------------------
# MODEL SELECTION
# -----------------------------------------------------------------------------

model_selection:

  target_entity:

    name:
      "<Identify the variable that represents the outcome the model is expected to predict.>"

    datatype:
      "<Describe the nature of the values represented by the prediction target.>"

    description:
      "<Explain what the target represents in the business context.>"

    source:
      "<Identify where the target information originates in the available data.>"

  derivation:
    "<Describe how the target is derived from the available business or data information.>"

  positive_class:
    "<Identify the outcome that represents the positive case, when the prediction problem has a positive outcome.>"

  negative_class:
    "<Identify the outcome that represents the negative case, when the prediction problem has a negative outcome.>"

  prediction_grain:

    entity:
      "<Identify the real-world entity for which each prediction is generated.>"

    keys:
      - "<Identify a field that uniquely identifies the prediction entity or prediction instance.>"

    frequency:
      "<Describe how frequently predictions are expected to be generated for each prediction entity, when applicable.>"

  recommended_model:

    model_id:
      "<Identify the model that should be considered the primary candidate based on the data characteristics, prediction problem, and training objective.>"

    rank:
      "<State the relative position of this candidate among the considered models.>"

    suitability_score:
      "<Estimate how suitable this model is for the identified prediction problem based on the available evidence.>"

    recommendation:
      "<Describe the role this model should play among the considered model candidates.>"

  candidates:

    - model_id:
        "<Identify a model that should be considered for training.>"

      rank:
        "<State the relative position of this candidate among the considered models.>"

      suitability_score:
        "<Estimate how suitable this model is for the identified prediction problem based on the available evidence.>"

      recommendation:
        "<Describe the role this model should play among the considered model candidates.>"

      reasoning:

        strengths:
          - "<Describe the characteristics of this model that are particularly suitable for the available data and use case.>"

        weaknesses:
          - "<Describe the characteristics of this model that could limit its suitability for the available data or use case.>"

        suitability:
          - "<Explain why this model is appropriate for the prediction problem and available training information.>"

    - model_id:
        "<Identify another model that should be considered for training.>"

      rank:
        "<State the relative position of this candidate among the considered models.>"

      suitability_score:
        "<Estimate how suitable this model is for the identified prediction problem based on the available evidence.>"

      recommendation:
        "<Describe the role this model should play among the considered model candidates.>"

    - model_id:
        "<Identify another model that should be considered for training.>"

      rank:
        "<State the relative position of this candidate among the considered models.>"

      suitability_score:
        "<Estimate how suitable this model is for the identified prediction problem based on the available evidence.>"

      recommendation:
        "<Describe the role this model should play among the considered model candidates.>"

  primary_metric:
    *primary_metric_name

  direction:
    "<Determine whether higher or lower values of the primary metric represent better model performance.>"

  tie_breakers:
    - "<Identify an additional factor that should be considered when candidate models have comparable primary metric performance.>"

  constraints:
    "<Define any conditions that candidate models must satisfy before they can be selected.>"

  selection_strategy:
    "<Describe how the final model should be chosen from the trained and validated candidates.>"

  training:

    mode:
      "<Describe the overall approach for training and comparing the selected model candidates.>"

    baseline_model:
      "<Identify the model or simple reference approach that should be used as the baseline for comparison, when applicable.>"

    ensemble:

      enabled:
        "<Determine whether combining multiple trained models is appropriate for improving the final prediction performance.>"

      strategy:
        "<Describe how the selected models should be combined when an ensemble is used.>"

    random_seed: 42

    early_stopping:

      enabled:
        "<Determine whether training should stop when the monitored validation performance stops improving.>"

      patience:
        "<Specify how many evaluation rounds without meaningful improvement should be tolerated before training stops.>"

      metric:
        *primary_metric_name

  max_training_time:
    "<Specify the maximum amount of time that may be spent training the models, when a training limit is required.>"

  model_selection_strategy:
    "<Describe the overall approach for comparing trained models and determining which model should become the final model.>"

  # Model Selection
  models:

    - model_id:
        "<Identify the specific model that should be trained.>"

      framework:
        "<Identify the software framework that should be used to train the selected model.>"

      algorithm:
        "<Identify the specific machine learning algorithm represented by the selected model.>"

      enabled:
        "<Determine whether this model should be included in the training process.>"

      parameters:
        "<Specify the model parameters that should remain fixed during training rather than being searched automatically.>"

      hyperparameter_optimization:

        enabled:
          "<Determine whether searching for better model parameter values is warranted for this training job.>"

        method:
          "<Select the parameter search approach that is appropriate for the number of candidate parameters, available compute, and training objective.>"

        objective_metric:
          *primary_metric_name

        direction:
          "<Determine whether improvement in the primary metric corresponds to increasing or decreasing its value.>"

        max_trials:
          "<Specify the maximum number of model configurations that should be evaluated during parameter optimization.>"

        timeout:
          "<Specify the maximum amount of time that should be allocated to parameter optimization, when a limit is appropriate.>"

        search_space:
          "<Define the model parameters whose values should be explored and describe the useful range or set of values for each parameter.>"

        pruning:

          enabled:
            "<Determine whether poorly performing training trials should be stopped before completion to conserve resources.>"



# -----------------------------------------------------------------------------
# ARTIFACTS
# -----------------------------------------------------------------------------

artifacts:

  output_path:
    "<Specify where the outputs generated by this training job should be stored.>"

  save:
    model: true
    metrics: true
    predictions: false
    explainability: false
    training_config: true

  # serialization_format: "<enum: pickle|joblib|onnx|safetensors|framework_native>"
  # :CHECK: need to check the common serialization format to support all the OS
  serialization_format: "onnx"

  explainability_method:
    "<Identify the approach that should be used to explain the trained model when explainability is required.>"