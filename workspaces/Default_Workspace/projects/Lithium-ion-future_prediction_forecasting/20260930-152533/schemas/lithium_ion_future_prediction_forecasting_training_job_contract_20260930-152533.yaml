# =============================================================================
# TRAINING JOB CONTRACT — AutoML Platform
# Scope: AGENT TRAINING ONLY.
#
# Dataset ingestion, data understanding, profiling, feature engineering,
# feature selection, and preprocessing are handled by upstream agents.
# This contract consumes their finalized outputs through upstream_artifacts.
#
# The training agent uses this contract to:
# 1. Understand the ML problem.
# 2. Select/validate the training strategy.
# 3. Train candidate models.
# 4. Optimize hyperparameters.
# 5. Evaluate and select the best model.
#
# Every field should contain either a concrete value or an explicit null when
# it is not applicable.
# =============================================================================


# -----------------------------------------------------------------------------
# PRIMARY METRIC
# -----------------------------------------------------------------------------
# Single source of truth for the metric used throughout training, optimization,
# evaluation, and model selection. The same definition must not be duplicated.
# -----------------------------------------------------------------------------

x-primary-metric-name: MAE
x-primary-metric-def:
  value: MAE
  source: model_selection
  confidence: 0.95
  confirmation_threshold: 0.85
  requires_confirmation: false
  direction: minimize
  rationale: Mean Absolute Error directly reflects the average absolute dollar deviation in battery cell cost projections, maintaining robust interpretability without over-penalizing historical turning points.
  business_interpretation: null
  evidence:
    - Task is continuous multivariate time-series forecasting for lithium-ion battery cell unit prices.
    - Business stakeholders require dollar-denominated accuracy metrics directly comparable across forecasting horizons.
  secondary_metrics:
    - RMSE
    - WAPE
    - MAPE
    - R2


# -----------------------------------------------------------------------------
# TRAINING JOB
# -----------------------------------------------------------------------------

training_job:
  job_id: Lithium-ion-future_prediction_forecasting_training_20260930-152533
  experiment_name: Lithium-ion-future prediction forecasting
  version: 1.0.0
  created_at: '2026-09-30T10:17:12.063Z'
  created_by: Training Configuration Agent
  description: Production training configuration and execution recipe for forecasting lithium-ion battery cell prices using gradient boosted regression models (LightGBM and XGBoost).


# -----------------------------------------------------------------------------
# ML TASK
# -----------------------------------------------------------------------------

task:
  task_type: forecasting
  task_subtype: multivariate_price_forecasting
  learning_type: supervised
  prediction_type: value


# -----------------------------------------------------------------------------
# UPSTREAM ARTIFACTS
# -----------------------------------------------------------------------------
# References finalized outputs from upstream agents.
# These are identifiers, not definitions of those artifacts.
# -----------------------------------------------------------------------------

upstream_artifacts:
  dataset_id: /workspace/20260930-152533/python_script/dataset.parquet
  dataset_version: '1.0'
  validated_features:
    - Entity
    - Code
    - Year
    - price_lag_1_is_na
    - log_price_lag_2
    - log_year_index_standardized
    - year_squared_standardized
    - pca_latent_factor_2
    - pca_latent_factor_3
    - Price of lithium-ion battery cells
  profiling_report_id: /workspace/20260930-152533/schemas/profiling_report.json
  relationship_schema_id: null
  row_count: 6
  column_count: 10


# -----------------------------------------------------------------------------
# DATA SPLITTING
# -----------------------------------------------------------------------------

split:
  strategy: random
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  split_date: null
  random_seed: 42
  stratify_by: null
  group_by: null
  time_column: Year
  cross_validation:
    enabled: true
    strategy: k_fold
    folds: 3
    shuffle: true
    random_seed: 42


# -----------------------------------------------------------------------------
# CLASS IMBALANCE
# -----------------------------------------------------------------------------

imbalance:
  detected: false
  ratio: null
  strategy: none
  class_weights: none
  sampling:
    method: none
    sampling_ratio: null


# -----------------------------------------------------------------------------
# HYPERPARAMETER OPTIMIZATION
# -----------------------------------------------------------------------------

hyperparameter_optimization:
  enabled: true
  method: bayesian
  objective_metric: MAE
  direction: minimize
  max_trials: 25
  timeout: 300
  search_space: defined
  pruning:
    enabled: false


# -----------------------------------------------------------------------------
# SEARCH SPACE
# -----------------------------------------------------------------------------
# Generic representation used by the training engine. The actual parameters
# depend on the selected model family.
# -----------------------------------------------------------------------------

search_space:
  n_estimators:
    type: integer
    min: 20
    max: 150
    values:
      - 20
      - 50
      - 100
      - 150
  learning_rate:
    type: continuous
    min: 0.01
    max: 0.25
    values:
      - 0.01
      - 0.05
      - 0.1
      - 0.2
  max_depth:
    type: integer
    min: 2
    max: 6
    values:
      - 2
      - 3
      - 4
      - 6
  subsample:
    type: continuous
    min: 0.6
    max: 1
    values:
      - 0.6
      - 0.8
      - 1


# -----------------------------------------------------------------------------
# TRAINING OBJECTIVE
# -----------------------------------------------------------------------------

objective:
  training_loss: mae
  optimization_metric: MAE
  direction: minimize
  custom_objective:
    enabled: false
    definition: null


# -----------------------------------------------------------------------------
# EVALUATION
# -----------------------------------------------------------------------------

evaluation:
  primary_metric:
    value: MAE
    source: model_selection
    confidence: 0.95
    confirmation_threshold: 0.85
    requires_confirmation: false
    rationale: Mean Absolute Error quantifies average absolute prediction deviation on price targets in raw unit values.
    evidence:
      - 'Continuous price forecasting target: Price of lithium-ion battery cells'
      - Direct interpretability for procurement, cost estimation, and capacity planning
  secondary_metrics:
    - RMSE
    - WAPE
    - MAPE
    - R2
  thresholds:
    primary_metric_min: null
    secondary_metric_constraints:
      R2: '>= 0.60'
      MAPE: <= 25.0
  segment_analysis:
    - Entity
  confidence_intervals:
    enabled: true
  bootstrap:
    enabled: true
    samples: 1000
  fairness_scope:
    protected_attributes: []
    metric: none
    max_disparity: null


# -----------------------------------------------------------------------------
# THRESHOLD OPTIMIZATION
# -----------------------------------------------------------------------------
# Applicable primarily to classification models producing probabilities or
# scores that must be converted into business decisions.
# -----------------------------------------------------------------------------

thresholding:
  enabled: false
  default_threshold: null
  optimization:
    enabled: false
    metric: null
    constraints: null


# -----------------------------------------------------------------------------
# VALIDATION GATES
# -----------------------------------------------------------------------------
# Hard requirements that a trained model must satisfy before it can be
# considered a successful training result.
# -----------------------------------------------------------------------------

validation_gates:
  minimum_primary_metric: 300
  maximum_overfitting_gap: 75
  maximum_latency: 150
  maximum_model_size: 50MB
  fairness_requirements: null
  data_quality_requirements:
    max_null_rate: 0.05
    schema_match: strict
  calibration_requirement:
    method: none
    max_calibration_error: null
  stability_requirement:
    metric_variance_across_folds_max: 0.25
  pass_condition: Validation MAE must meet target threshold with bounded fold variance across cross-validation splits.


# -----------------------------------------------------------------------------
# MODEL SELECTION
# -----------------------------------------------------------------------------
